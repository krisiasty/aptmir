version: 2

project_name: aptmir

builds:
  - id: darwin
    binary: aptmir
    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}
        -X main.commit={{ .Commit }}
        -X main.built={{ .Date }}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
  - id: linux
    binary: aptmir
    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}
        -X main.commit={{ .Commit }}
        -X main.built={{ .Date }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

# The binary format publishes executables directly without archive containers.
archives:
  - id: raw-binaries
    ids:
      - darwin
      - linux
    formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: macos-archives
    ids:
      - darwin
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

homebrew_casks:
  - name: aptmir
    ids:
      - macos-archives
    homepage: "https://github.com/krisiasty/aptmir"
    description: "Ranks Ubuntu archive mirrors by measured freshness and throughput"
    license: "Apache-2.0"
    repository:
      owner: krisiasty
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    binaries:
      - aptmir
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", staged_path]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  abbrev: 8
  format: "- [{{ .SHA }}](https://github.com/krisiasty/aptmir/commit/{{ .SHA }}) {{ .Message }}"
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
